name: Feedback
description: Report a confusing step, broken workflow, or client-specific problem.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DotAIOS on real work. Please remove personal context, credentials, tokens, and local paths before posting.

  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: Describe the outcome you wanted, not any private project details.
      placeholder: I wanted to connect an existing project and ask Codex to...
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the relevant command or safe error text if you have it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, DotAIOS version, and assistant (for example, macOS 15, DotAIOS 2.0.19, Codex).
      placeholder: macOS 15, DotAIOS 2.0.19, Codex
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste relevant doctor output only after removing personal context, credentials, tokens, usernames, and local paths.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal context, credentials, tokens, and local paths from this report.
          required: true

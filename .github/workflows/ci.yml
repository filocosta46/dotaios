name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 24 is the release line INSTALL.md sends a first-time user to; it has
        # to be tested or the advertised install path lands on an untested Node.
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (node --check over all source)
        run: pnpm run syntax-check

      - name: Run tests
        run: pnpm test

      - name: Run smoke test
        run: pnpm run smoke

      - name: Run CLI help check
        run: pnpm run check

      - name: Verify package contents
        run: npm pack --dry-run

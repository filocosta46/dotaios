name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (node --check over all source)
        run: pnpm run syntax-check

      - name: Run tests
        # The suite contains deliberate 32-writer durability/contention tests.
        # Running unrelated filesystem-heavy test files beside them can consume
        # their bounded lock deadlines without exercising additional behavior.
        run: pnpm exec node --test --test-concurrency=1 tests/**/*.test.mjs

      - name: Run smoke test
        run: pnpm run smoke

      - name: Run CLI help check
        run: pnpm run check

      - name: Verify package contents
        run: npm pack --dry-run

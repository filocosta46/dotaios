name: Release freshness

# Guards the repo and npm against disagreeing in either direction: a version the
# repo announces that `npx dotaios@latest` does not serve, AND a published
# version that no pushed tag points at (which 404s every release-pinned doc
# link). Runs after a release tag is pushed, on a daily schedule as a safety net,
# and on demand. The schedule is the load-bearing trigger for the untagged case:
# if the tag is never pushed, the tag trigger never fires.
# Deliberately NOT on every PR — a pre-publish version bump is expected to be
# ahead of npm and must not fail CI.

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  freshness:
    name: npm serves the released version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify npm and the released tags agree
        run: node scripts/verify-npm-freshness.mjs

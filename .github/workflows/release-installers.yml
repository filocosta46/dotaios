name: Release Installers

# The Windows MSI is a future, optional install path. The supported install
# path for every OS is `npx dotaios`. This workflow is manual-only so a broken
# MSI build never blocks a release. Run it from the Actions tab when needed.
on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version to stamp on the MSI (e.g. 1.10.0). Leave empty to read package.json."
        required: false
        type: string

jobs:
  windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $override = "${{ inputs.version_override }}"
          if ($override) {
            $version = $override
          } else {
            $version = (Get-Content package.json | ConvertFrom-Json).version
          }
          if ($version -match '^(\d+)\.(\d+)\.(\d+)') {
            $clean = "$($matches[1]).$($matches[2]).$($matches[3])"
          } else {
            throw "Could not parse a major.minor.patch version from $version"
          }
          echo "version=$clean" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $clean"

      - name: Install WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Build MSI
        shell: pwsh
        run: |
          wix build installers\windows\dotaios.wxs `
            -d ProductVersion=${{ steps.pkg.outputs.version }} `
            -o dotaios-${{ steps.pkg.outputs.version }}.msi
          if (-not (Test-Path "dotaios-${{ steps.pkg.outputs.version }}.msi")) {
            throw "MSI output was not produced."
          }
          Get-Item "dotaios-${{ steps.pkg.outputs.version }}.msi" | Select-Object Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotaios-windows-msi
          path: dotaios-*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dotaios-*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
